name: tmux compatibility

on:
  push:
    branches: [main, w1-loop, pr/stop4c-preweek-2026-11-18]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: tmux ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.5a"
            sha256: 16216bd0877170dfcc64157085ba9013610b12b082548c7c9542cc0103198951
          - version: "3.6b"
            sha256: 390759d25fdba016887ec982b808927e637070fd7d03a8021f8ef3102b9ae3c7
          - version: "3.7c"
            sha256: 7c60cae9a0e25288e2e24750aafc9e8800fc7fd4555e447e1b29ee4201cfb3bf
          - version: "3.8"
            sha256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
    env:
      TMUX_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config bison libevent-dev libncurses-dev bubblewrap jq openssh-server scdaemon
      - name: tmux ${{ matrix.version }} from its release archive
        env:
          TMUX_ARCHIVE: https://github.com/tmux/tmux/releases/download/${{ matrix.version }}/tmux-${{ matrix.version }}.tar.gz
          TMUX_SHA256: ${{ matrix.sha256 }}
        run: |
          curl -fsSL -o tmux.tar.gz "$TMUX_ARCHIVE"
          printf '%s  %s\n' "$TMUX_SHA256" tmux.tar.gz | sha256sum -c -
          tar -xzf tmux.tar.gz
          cd "tmux-$TMUX_VERSION"
          ./configure --prefix="$HOME/tmux-$TMUX_VERSION"
          make -j"$(nproc)"
          make install
      - name: Unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: What this tmux does with a dead pane's pipe
        run: |
          export PATH="$HOME/tmux-$TMUX_VERSION/bin:$PATH"
          unset TMUX TMUX_PANE
          d=$(mktemp -d)
          tmux -S "$d/s" -f /dev/null new-session -d -s m 'sleep 1; echo out; sleep 1'
          tmux -S "$d/s" set-option -p -t m remain-on-exit on
          tmux -S "$d/s" pipe-pane -t m "cat > '$d/piped'; echo ended > '$d/end'"
          sleep 4
          tmux -V
          tmux -S "$d/s" display-message -p -t m 'its program has ended: pane_dead=#{pane_dead}; its pipe: pane_pipe=#{pane_pipe}'
          if [ -e "$d/end" ]; then echo "the pipe's reader got the end of its input when the program ended"; else echo "the pipe's reader got no end of its input when the program ended"; fi
          echo "what the pipe carried: $(cat "$d/piped")"
          tmux -S "$d/s" kill-server
          sleep 1
          if [ -e "$d/end" ]; then echo "after the server ended, the reader had its end"; else echo "after the server ended, the reader still had no end"; fi
          rm -rf -- "$d"
      - name: The test file
        run: |
          export PATH="$HOME/tmux-$TMUX_VERSION/bin:$PATH"
          tmux -V
          bash --version | head -1
          jq --version
          gpg --version | head -1
          ssh -V
          bash tests/run.sh
      - name: Preview edits with the native planner
        if: matrix.version == '3.8'
        run: python3 tests/workplace-preview.py

  tests:
    name: tests
    if: always()
    needs: compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Require every version
        env:
          RESULT: ${{ needs.compatibility.result }}
        run: test "$RESULT" = success
